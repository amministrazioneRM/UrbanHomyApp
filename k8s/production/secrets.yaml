# =============================================================================
# Urban Homy — Kubernetes Secrets
#
# DO NOT commit this file with real values.
# Secrets must be created manually on the cluster with kubectl.
#
# INITIAL SETUP — run these commands on the k3s server:
#
# NOTE: the database is EXTERNAL to the cluster (runs on the host).
# The "db" Service in db-external.yaml resolves to the host IP —
# so the hostname to use in DATABASE_URL is always "db".
# Before creating the secret, replace <HOST_IP> in db-external.yaml
# with the correct IP (see instructions in that file).
#
# SQL Server connection string format:
#   sqlserver://<user>:<password>@db:1433;database=urbanhomy;encrypt=true;trustServerCertificate=true
#
#   kubectl create secret generic urbanhomy-backend-secret \
#     --from-literal=DATABASE_URL="sqlserver://urbanhomy_app:<password>@db:1433;database=urbanhomy;encrypt=true;trustServerCertificate=true" \
#     --from-literal=JWT_SECRET=<long-random-jwt-secret> \
#     --from-literal=BCRYPT_SALT_ROUNDS=10 \
#     --from-literal=CORS_ALLOWED_ORIGINS=https://<portal-domain> \
#     --from-literal=SEED_SAMPLE_DATA=false
#
#   kubectl create secret generic urbanhomy-grafana-secret \
#     --from-literal=GF_SECURITY_ADMIN_USER=admin \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=<grafana-password>
#
# IMAGE PULL SECRET for ghcr.io (requires PAT with read:packages scope):
#
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username-or-org> \
#     --docker-password=<PAT-with-read:packages>
#
# Verify creation:
#   kubectl get secrets
# =============================================================================
