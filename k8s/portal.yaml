---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: portal
          image: ghcr.io/GITHUB_ORG/urban-homy-amministrazionerm/portal:latest
          ports:
            - containerPort: 5173
          env:
            - name: PORT
              value: "5173"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: portal
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
  type: NodePort
