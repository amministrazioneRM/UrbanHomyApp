# =============================================================================
# External database — Service + Endpoints
#
# The SQL Server database runs outside the cluster (on the host machine).
# This manifest creates a Kubernetes Service named "db" that resolves
# to the host IP, allowing pods to connect using the connection string:
#   sqlserver://user:pass@db:1433;database=urbanhomy;...
#
# SETUP: replace <HOST_IP> with the IP of the server visible from inside
# the k3s cluster. To find it:
#   ip route | grep default | awk '{print $3}'
# Typically 10.0.2.2 (VirtualBox), 172.17.0.1 (Docker bridge),
# or the server's LAN IP (e.g. 192.168.1.x or 10.x.x.x).
#
# On k3s the cni0/flannel interface gateway is usually
# reachable via: kubectl get nodes -o wide (INTERNAL-IP column)
# =============================================================================
---
apiVersion: v1
kind: Endpoints
metadata:
  name: db
subsets:
  - addresses:
      - ip: <HOST_IP>   # replace with host IP (see above)
    ports:
      - port: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  ports:
    - port: 1433
      targetPort: 1433
  clusterIP: None   # headless — resolves directly to the Endpoints IP
