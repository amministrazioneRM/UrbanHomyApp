# =============================================================================
# Database esterno — Service + Endpoints
#
# Il database Postgres gira fuori dal cluster (sulla stessa macchina host).
# Questo manifest crea un Service Kubernetes di nome "db" che risolve
# all'IP dell'host, permettendo ai pod di connettersi con la stringa:
#   postgresql://user:pass@db:5432/urbanhomy
#
# SETUP: sostituire <HOST_IP> con l'IP del server visibile dall'interno
# del cluster k3s. Per trovarlo:
#   ip route | grep default | awk '{print $3}'
# Tipicamente è 10.0.2.2 (VirtualBox), 172.17.0.1 (Docker bridge),
# oppure l'IP LAN del server (es. 192.168.1.x o 10.x.x.x).
#
# Su k3s il gateway dell'interfaccia cni0/flannel è solitamente
# raggiungibile tramite: kubectl get nodes -o wide (colonna INTERNAL-IP)
# =============================================================================
---
apiVersion: v1
kind: Endpoints
metadata:
  name: db
subsets:
  - addresses:
      - ip: <HOST_IP>   # sostituire con l'IP host (vedi sopra)
    ports:
      - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # headless — risolve direttamente all'IP dell'Endpoints
