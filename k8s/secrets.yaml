# =============================================================================
# Urban Homy — Kubernetes Secrets
#
# NON committare questo file con valori reali.
# I Secret vanno creati manualmente sul cluster con kubectl.
#
# SETUP INIZIALE — eseguire questi comandi sul server k3s:
#
# NOTA: il database è ESTERNO al cluster (gira sull'host).
# Il Service "db" in db-external.yaml risolve all'IP dell'host —
# quindi l'hostname da usare nella DATABASE_URL è sempre "db".
# Prima di creare il secret, sostituire <HOST_IP> in db-external.yaml
# con l'IP corretto (vedi istruzioni in quel file).
#
#   kubectl create secret generic urbanhomy-backend-secret \
#     --from-literal=DATABASE_URL=postgresql://urbanhomy_app:<password>@db:5432/urbanhomy \
#     --from-literal=JWT_SECRET=<jwt-secret-lungo-e-random> \
#     --from-literal=BCRYPT_SALT_ROUNDS=10 \
#     --from-literal=CORS_ALLOWED_ORIGINS=https://<dominio-portal> \
#     --from-literal=SEED_SAMPLE_DATA=false
#
#   kubectl create secret generic urbanhomy-grafana-secret \
#     --from-literal=GF_SECURITY_ADMIN_USER=admin \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=<password-grafana>
#
# IMAGE PULL SECRET per ghcr.io (richiede PAT con scope read:packages):
#
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username-o-org> \
#     --docker-password=<PAT-con-read:packages>
#
# Verificare la creazione:
#   kubectl get secrets
# =============================================================================
