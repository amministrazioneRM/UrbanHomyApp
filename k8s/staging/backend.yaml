---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: staging
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/amministrazionerm/urban-homy-amministrazionerm/backend:staging
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanhomy-backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanhomy-backend-secret
                  key: JWT_SECRET
            - name: BCRYPT_SALT_ROUNDS
              valueFrom:
                secretKeyRef:
                  name: urbanhomy-backend-secret
                  key: BCRYPT_SALT_ROUNDS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: urbanhomy-backend-secret
                  key: CORS_ALLOWED_ORIGINS
            - name: SEED_SAMPLE_DATA
              valueFrom:
                secretKeyRef:
                  name: urbanhomy-backend-secret
                  key: SEED_SAMPLE_DATA
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: staging
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
  type: NodePort
