services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA}
      BC_DB_SERVER: ${BC_DB_SERVER:-srvdb.urbanhomy.local}
      BC_DB_NAME: ${BC_DB_NAME:-URBAN_LIVE}
      BC_DB_DOMAIN: ${BC_DB_DOMAIN:-}
      BC_DB_USER: ${BC_DB_USER:-}
      BC_DB_PASSWORD: ${BC_DB_PASSWORD:-}
      MEWS_CLIENT_TOKEN: ${MEWS_CLIENT_TOKEN:-}
      MEWS_ACCESS_TOKEN_30_008: ${MEWS_ACCESS_TOKEN_30_008:-}
      MEWS_ACCESS_TOKEN_30_007: ${MEWS_ACCESS_TOKEN_30_007:-}
      MEWS_ACCESS_TOKEN_30_006: ${MEWS_ACCESS_TOKEN_30_006:-}
      MEWS_ACCESS_TOKEN_30_005: ${MEWS_ACCESS_TOKEN_30_005:-}
      MEWS_ACCESS_TOKEN_30_004: ${MEWS_ACCESS_TOKEN_30_004:-}
      MEWS_ACCESS_TOKEN_30_003: ${MEWS_ACCESS_TOKEN_30_003:-}
      MEWS_ACCESS_TOKEN_30_002: ${MEWS_ACCESS_TOKEN_30_002:-}
      MEWS_ACCESS_TOKEN_30_001: ${MEWS_ACCESS_TOKEN_30_001:-}
    depends_on:
      db:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${PORTAL_PORT}:${PORTAL_PORT}"
    environment:
      PORT: ${PORTAL_PORT}
      API_BASE_URL: ${API_BASE_URL}
      MSAL_CLIENT_ID: ${MSAL_CLIENT_ID}
      MSAL_TENANT_ID: ${MSAL_TENANT_ID}
    depends_on:
      - backend

volumes:
  sqlserver_data:
