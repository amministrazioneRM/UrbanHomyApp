services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA}
    depends_on:
      db:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${PORTAL_PORT}:${PORTAL_PORT}"
    environment:
      PORT: ${PORTAL_PORT}
      MSAL_CLIENT_ID: ${MSAL_CLIENT_ID:-}
      MSAL_TENANT_ID: ${MSAL_TENANT_ID:-}
    depends_on:
      - backend

volumes:
  sqlserver_data:
