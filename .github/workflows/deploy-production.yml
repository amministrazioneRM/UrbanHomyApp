name: Deploy to Kubernetes

on:
  push:
    branches:
      - "release/**"

# Permissions required to push to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push backend image
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      image_base: ${{ steps.image-base.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: image-base
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "value=ghcr.io/${OWNER,,}/urban-homy-amministrazionerm" >> "$GITHUB_OUTPUT"

      - name: Extract version from branch name
        id: extract-version
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image-base.outputs.value }}/backend:${{ steps.extract-version.outputs.version }}
            ${{ steps.image-base.outputs.value }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ---------------------------------------------------------------------------
  # Job 2: Build and push portal image (parallel to build-backend)
  # ---------------------------------------------------------------------------
  build-portal:
    name: Build portal
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      image_base: ${{ steps.image-base.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: image-base
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "value=ghcr.io/${OWNER,,}/urban-homy-amministrazionerm" >> "$GITHUB_OUTPUT"

      - name: Extract version from branch name
        id: extract-version
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portal/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.value }}/portal:${{ steps.extract-version.outputs.version }}
            ${{ steps.image-base.outputs.value }}/portal:latest
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to k3s via Tailscale (waits for both builds)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply Kubernetes manifests (idempotent)
        run: kubectl apply -f k8s/production/

      - name: Update backend image
        run: |
          VERSION="${{ needs.build-backend.outputs.version }}"
          kubectl set image deployment/backend \
            backend=${{ needs.build-backend.outputs.image_base }}/backend:${VERSION} \
            --namespace=production

      - name: Update portal image
        run: |
          VERSION="${{ needs.build-portal.outputs.version }}"
          kubectl set image deployment/portal \
            portal=${{ needs.build-portal.outputs.image_base }}/portal:${VERSION} \
            --namespace=production

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend --timeout=120s --namespace=production

      - name: Wait for portal rollout
        run: kubectl rollout status deployment/portal --timeout=120s --namespace=production
