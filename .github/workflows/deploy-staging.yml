name: Deploy to Kubernetes (staging)

on:
  push:
    branches:
      - develop

# Permissions required to push to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/urban-homy-amministrazionerm

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push backend image
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from commit SHA
        id: extract-version
        run: |
          VERSION="staging-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ steps.extract-version.outputs.version }}
            ${{ env.IMAGE_BASE }}/backend:staging
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

  # ---------------------------------------------------------------------------
  # Job 2: Build and push portal image (parallel to build-backend)
  # ---------------------------------------------------------------------------
  build-portal:
    name: Build portal
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from commit SHA
        id: extract-version
        run: |
          VERSION="staging-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portal/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/portal:${{ steps.extract-version.outputs.version }}
            ${{ env.IMAGE_BASE }}/portal:staging
          cache-from: type=gha,scope=portal-staging
          cache-to: type=gha,mode=max,scope=portal-staging
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL_STAGING }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to k3s via Tailscale (waits for both builds)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to k3s (staging)
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply Kubernetes manifests (idempotent)
        run: kubectl apply -f k8s/staging/

      - name: Update backend image
        run: |
          VERSION="${{ needs.build-backend.outputs.version }}"
          kubectl set image deployment/backend \
            backend=${{ env.IMAGE_BASE }}/backend:${VERSION} \
            --namespace=staging

      - name: Update portal image
        run: |
          VERSION="${{ needs.build-portal.outputs.version }}"
          kubectl set image deployment/portal \
            portal=${{ env.IMAGE_BASE }}/portal:${VERSION} \
            --namespace=staging

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend --timeout=120s --namespace=staging

      - name: Wait for portal rollout
        run: kubectl rollout status deployment/portal --timeout=120s --namespace=staging
